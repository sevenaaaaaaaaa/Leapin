name: LeapinMobile
options:
  bundleIdPrefix: app.leapin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  Leapin:
    path: ..

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  LeapinTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: LeapinTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.leapin.mobile.tunnel
        PRODUCT_NAME: LeapinTunnel
        MARKETING_VERSION: "1.4"
        CURRENT_PROJECT_VERSION: "5"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LeapinTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: LeapinTunnel/LeapinTunnel.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: Leapin
        product: LeapinCore
      - package: Leapin
        product: LeapinNet

  LeapinMobile:
    type: application
    platform: iOS
    sources:
      - path: LeapinMobile
    dependencies:
      - package: Leapin
        product: LeapinCore
      - package: Leapin
        product: LeapinControl
      - package: Leapin
        product: LeapinPolicy
      - package: Leapin
        product: LeapinNet
      - target: LeapinTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.leapin.mobile
        PRODUCT_NAME: Leapin
        MARKETING_VERSION: "1.4"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: LeapinMobile.entitlements
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  LeapinMobile:
    build:
      targets:
        LeapinMobile: all
    run:
      config: Debug
    archive:
      config: Release
