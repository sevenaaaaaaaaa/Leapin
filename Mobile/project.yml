name: LeapinMobile
options:
  bundleIdPrefix: app.leapin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  Leapin:
    path: ..

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  LeapinMobile:
    type: application
    platform: iOS
    sources:
      - path: LeapinMobile
    dependencies:
      - package: Leapin
        product: LeapinCore
      - package: Leapin
        product: LeapinControl
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.leapin.mobile
        PRODUCT_NAME: Leapin
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  LeapinMobile:
    build:
      targets:
        LeapinMobile: all
    run:
      config: Debug
    archive:
      config: Release
