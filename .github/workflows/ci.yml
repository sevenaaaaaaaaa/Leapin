name: CI

# Catches a broken build on the branch, not at release time. Publishing lives in
# release.yml, which only runs on a v* tag.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Same two builds the release makes, so green here means the tag will build too.
  build:
    name: Build macOS + iOS
    runs-on: macos-26
    # A hung build should fail visibly instead of blocking the queue for an hour.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build macOS app and CLI
        run: ./scripts/build-app.sh

      - name: Build iOS app (unsigned)
        run: |
          set -euo pipefail
          (cd Mobile && xcodegen generate)
          xcodebuild -project Mobile/LeapinMobile.xcodeproj -scheme LeapinMobile \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath Mobile/build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            build | tail -20


      - name: Configure Android toolchain
        run: |
          set -euo pipefail
          if [ -n "${JAVA_HOME_17_ARM64:-}" ]; then echo "JAVA_HOME=$JAVA_HOME_17_ARM64" >> "$GITHUB_ENV"; fi
          SDK="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi
          java -version

      - name: Build Android APK
        run: |
          set -euo pipefail
          (cd Android && ./gradlew assembleRelease --no-daemon)

      - name: Summary
        run: |
          set -euo pipefail
          echo "macOS app: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Leapin.app/Contents/Info.plist)"
          codesign -dv dist/Leapin.app 2>&1 | head -2
          ls -lh dist/Leapin.app/Contents/MacOS/
          ls -lh Android/app/build/outputs/apk/release/

  tests:
    name: Unit tests
    runs-on: macos-26
    # The suite takes a few minutes; anything beyond this is a hang, not slowness.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: swift test
        # No `| tail`: piping to tail buffers everything until the process exits, so a
        # hung test produced a log with no test names in it at all.
        run: swift test 2>&1
